# Checks the formula and the cask on every push, the release's own push
# from tessaro-os included: style and audit, then each installed and tested
# on the platforms it supports.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      # Taps this checkout as alhafoudh/tessaro.
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew style alhafoudh/tessaro
      - run: brew audit --strict alhafoudh/tessaro/tessaro-ctl
      - run: brew audit --strict --cask alhafoudh/tessaro/tessaro-gui
      - run: brew audit --strict --cask alhafoudh/tessaro/try-tessaro

  formula:
    needs: audit
    strategy:
      matrix:
        os: [macos-latest, ubuntu-22.04, ubuntu-22.04-arm]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew install alhafoudh/tessaro/tessaro-ctl
      - run: brew test alhafoudh/tessaro/tessaro-ctl
      - run: tessaro-ctl --version

  cask:
    needs: audit
    strategy:
      matrix:
        include:
          - cask: tessaro-gui
            app: Tessaro.app
          - cask: try-tessaro
            app: Try Tessaro.app
      fail-fast: false
    runs-on: macos-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew install --cask "alhafoudh/tessaro/${{ matrix.cask }}"
      # The postflight step must have cleared it, or Gatekeeper refuses the app.
      - name: No quarantine flag
        env:
          APP: /Applications/${{ matrix.app }}
        run: |
          test -d "$APP"
          if xattr -p com.apple.quarantine "$APP" 2>/dev/null; then
            echo "::error::$APP is still quarantined"
            exit 1
          fi
          codesign --verify --deep "$APP"
